[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "framesight"
version = "0.1.0"
description = "Linux CLI alternative to Apple's Vision framework: faces, head pose, mouth openness, upper bodies and person masks from video, as JSON. CPU-only, no AVX2 needed."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gustavo Belo" }]
requires-python = ">=3.10"
keywords = ["face-detection", "head-pose-estimation", "face-mesh", "person-detection",
            "person-segmentation", "video-matting", "apple-vision", "opencv", "onnxruntime", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "onnxruntime>=1.16",
]

[project.urls]
Homepage = "https://github.com/GustavoBelo/framesight"
Issues = "https://github.com/GustavoBelo/framesight/issues"
Funding = "https://buymeacoffee.com/gustavobelo"

[project.optional-dependencies]
heif = ["pillow>=10", "pillow-heif>=0.16"]
dev = ["pytest>=8"]

[project.scripts]
framesight = "framesight.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
